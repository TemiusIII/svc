{% extends "base.html" %}
{% block title %}Вход{% endblock %}
{% block content %}
<h1>Вход</h1>
{% if request.query_params.get('error') %}<p class="flash">Неверный логин или пароль.</p>{% endif %}
<form method="post" action="/login" style="max-width:340px">
  <p><input name="login" placeholder="логин" required></p>
  <p><input name="password" type="password" placeholder="пароль" required></p>
  <p><button class="primary" type="submit">Войти</button></p>
</form>
<h2>Учётные записи стенда</h2>
<table>
  <tr><th>Логин</th><th>Имя</th></tr>
  {% for a in accounts %}<tr><td>{{ a.login }}</td><td>{{ a.full_name }}</td></tr>{% endfor %}
</table>
{% endblock %}

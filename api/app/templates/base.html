<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Сервис записи на приём{% endblock %}</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header>
  <span class="brand">artem_smirnov · запись на приём</span>
  {% if user %}
  <nav>
    <a href="/">Услуги</a>
    <a href="/specialists">Специалисты</a>
    <a href="/appointments">Мои записи</a>
    <a href="/summary">Сводка</a>
    <form method="post" action="/logout" class="inline"><button type="submit">Выйти ({{ user.login }})</button></form>
  </nav>
  {% endif %}
</header>
<main>
{% block content %}{% endblock %}
</main>
</body>
</html>
